# Filtering file used for the Tattletale plugin.
#
# Tattletale fails the build (failOnWarn=true) when the same class appears in
# more than one jar of the "full" package. The entries below are classes that
# are duplicated *by design* and are not a problem:
#
#   * module-info.class          - multi-release JAR descriptors; every modern
#                                jar has one, and they are ignored at runtime
#   * *.package-info            - empty package markers, e.g. the Hadoop ones
#   * javax.xml.bind.*          - the javax -> jakarta namespace migration: the
#                                "jakarta.xml.bind-api" and "jaxb-api" artifacts
#                                ship the very same javax.* classes
#   * javax.activation.*        - same story for the activation API
#   * net.jcip.annotations.*    - the same annotation in two artifacts
#
# This file is generated by .tools/scratch/dupes.ps1; keep it in step with the
# dependency graph.
