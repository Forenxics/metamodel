name: dc
on:
  push:
    branches: [ master ]
jobs:
  dependency-check:
    name: Dependency CVE scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: OWASP dependency-check
        if: ${{ secrets.NVD_API_KEY != '' }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B -ntp org.owasp:dependency-check-maven:check \
            -DnvdApiKey="${NVD_API_KEY}" \
            -DfailBuildOnCVSS=7 \
            -Dformat=HTML,SARIF \
            -DsuppressionFile=docs/dependency-check-suppressions.xml

      - name: OWASP dependency-check skipped
        if: ${{ secrets.NVD_API_KEY == '' }}
        run: echo "NVD_API_KEY is not configured - the dependency CVE scan was skipped."

      - name: Upload dependency-check report
        if: always() && ${{ secrets.NVD_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: '**/dependency-check-report.html'
          if-no-files-found: ignore
          retention-days: 30
