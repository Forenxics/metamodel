#
# Continuous integration for Apache MetaModel.
#
# Replaces the retired .travis.yml configuration. The Travis configuration
# only ever exercised JDK 8/9/11, which is why JDK-21 specific regressions went
# unnoticed for years - see the defect register in docs/DEFECT-REGISTER.md.

name: build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Weekly dependency-CVE sweep. 03:17 every Monday.
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  build:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 11 is the lowest JDK the test toolchain supports (EasyMock 5 needs
        # Java 11). 25 is the current LTS. The *published bytecode* of the
        # library stays at Java 8 - see AGENTS.md.
        java: [ '11', '17', '21', '25' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean install

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
          retention-days: 14

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    # The datastore-backed tests are enabled by the presence of
    # ~/metamodel-integrationtest-configuration.properties, not by a profile.
    # They need real servers, so they run on the default branch and on the
    # weekly schedule rather than on every pull request.
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      cassandra:
        image: cassandra:4.1
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'describe keyspaces'"
          --health-interval 15s --health-timeout 10s --health-retries 20
      couchdb:
        # CouchDB 2.3.1 is the oldest release that returns the opaque
        # "purge_seq" the adapter now tolerates. The adapter was fixed for
        # that shape, so the test runs against a real server again.
        image: couchdb:2.3.1
        ports:
          - 5984:5984
        options: >-
          --health-cmd "curl -fsS http://localhost:5984/ || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
      neo4j:
        # The adapter speaks the Neo4j 3.x REST API, whose root is /db/data.
        # Neo4j 4 and later removed it, so the 3.5 image is the one that
        # matches the adapter. The test seeds the graph it queries itself.
        image: neo4j:3.5
        env:
          NEO4J_AUTH: neo4j/metamodelci
        ports:
          - 7474:7474
        options: >-
          --health-cmd "wget -q -O /dev/null --header='Authorization: Basic bmVvNGo6bWV0YW1vZGVsY2k=' http://localhost:7474/db/data || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Write the integration test configuration
        run: |
          cp travis-metamodel-integrationtest-configuration.properties \
            "$HOME/metamodel-integrationtest-configuration.properties"
          cat "$HOME/metamodel-integrationtest-configuration.properties"

      - name: Integration tests
        run: mvn -B -ntp clean install

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
          retention-days: 14

  dependency-check:
    name: Dependency CVE scan
    runs-on: ubuntu-latest
    # Only on the default branch and on the weekly schedule - the NVD feed is
    # slow to download and rate limited.
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    # The NVD key is bound at the job level on purpose. The 'secrets' context is
    # NOT available in a step-level 'if' condition - a workflow that refers to
    # it there is rejected by GitHub before a single job starts, and the
    # rejection looks like a workflow file error rather than a mistake in the
    # expression. The 'env' context IS available in a step-level 'if', so the
    # job-level env is what the steps test.
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: OWASP dependency-check
        # Without an NVD API key the vulnerability feed download takes hours,
        # so the scan is skipped rather than run half-way.
        if: env.NVD_API_KEY != ''
        run: |
          mvn -B -ntp org.owasp:dependency-check-maven:check \
            -DnvdApiKey="${NVD_API_KEY}" \
            -DfailBuildOnCVSS=7 \
            -Dformat=HTML,SARIF \
            -DsuppressionFile=docs/dependency-check-suppressions.xml

      - name: OWASP dependency-check skipped
        if: env.NVD_API_KEY == ''
        run: echo "NVD_API_KEY is not configured - the dependency CVE scan was skipped."

      - name: Upload dependency-check report
        if: always() && env.NVD_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: '**/dependency-check-report.html'
          if-no-files-found: ignore
          retention-days: 30
