# Continuous integration has moved to GitHub Actions.
#
# The original Travis configuration only ever exercised JDK 8, 9 and 11, which
# is why JDK 21 specific regressions went unnoticed for years - including the
# deserialization defect that made every legacy MetaModel stream fail to load.
# See docs/DEFECT-REGISTER.md, entry SC-01.
#
# The replacement workflow lives in .github/workflows/build.yml and runs the
# build on JDK 11, 17 and 21, plus a weekly OWASP dependency-check job.
#
# This file is kept only so that the Travis dashboard does not show a
# "configuration error" for the repository. It performs no work.
